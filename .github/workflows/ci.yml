name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # No Base44 credentials here on purpose. The build warns that it does not
      # know its app id and still has to succeed — this job proves the bundle
      # compiles, not that the backend answers.
      - name: Build
        run: npm run build

      - name: Guard the API boundary
        # src/api exists so that nothing else knows how the backend is reached.
        # If this fires, a component reached past the facade and called fetch
        # itself — which is how the Base44 migration became a 69-site rewrite.
        run: |
          if grep -rn "api/http" src/ | grep -v "^src/api/"; then
            echo "::error::A file outside src/api imports the HTTP transport."
            exit 1
          fi
          echo "OK: the transport is confined to src/api"

      - name: Guard against Base44 coming back
        run: |
          if grep -rn "@base44\|base44Client\|app-params" src/ server/ scripts/ 2>/dev/null; then
            echo "::error::Base44 was removed in Phase 2. Nothing should reference it."
            exit 1
          fi
          echo "OK: no Base44 references"
